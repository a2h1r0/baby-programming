name: Publish to personal site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'a2h1r0/baby-programming' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the offline game and publication
        run: node --test

  publish:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: personal-page-baby-programming
      cancel-in-progress: false
    steps:
      - name: Check out the tested game
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out the publication repository using its deploy key
        uses: actions/checkout@v4
        with:
          repository: a2h1r0/personal-page
          ref: master
          path: site
          ssh-key: ${{ secrets.PERSONAL_PAGE_DEPLOY_KEY }}
      - name: Build the page with its canonical URL
        run: node source/scripts/build-publication.cjs site/apps/baby-programming
      - name: Publish the app without changing other site files
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/baby-programming/index.html
          if git diff --cached --quiet; then
            echo 'The published page is already up to date.'
            exit 0
          fi
          git commit -m "Publish baby-programming from ${SOURCE_SHA}"
          for attempt in 1 2 3; do
            git -C ../source fetch --no-tags origin main
            if [ "$(git -C ../source rev-parse FETCH_HEAD)" != "$SOURCE_SHA" ]; then
              echo 'A newer main commit exists; skip this outdated publication.'
              exit 0
            fi
            if git push origin HEAD:master; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Publication failed. Check repository permissions, branch rules, or conflicting changes.' >&2
              exit 1
            fi
            git fetch --no-tags origin master
            git rebase origin/master
          done
