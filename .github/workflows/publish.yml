name: Publish to personal site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify the GitHub App connection without deploying
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'a2h1r0/baby-programming' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.verify_only))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the offline game and publication
        run: node --test

  publish:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: personal-page-baby-programming
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Skip an outdated publication
        if: ${{ !inputs.verify_only }}
        id: latest
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$SOURCE_SHA" = "$latest" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main commit exists; skip this outdated publication.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Create a short-lived token for the personal site
        if: inputs.verify_only || steps.latest.outputs.current == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SITE_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITE_DEPLOY_APP_PRIVATE_KEY }}
          owner: a2h1r0
          repositories: personal-page
          permission-actions: write
      - name: Verify access to the personal site workflow without deploying
        if: inputs.verify_only
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          state="$(gh api repos/a2h1r0/personal-page/actions/workflows/deploy.yml --jq '.state')"
          if [ "$state" != 'active' ]; then
            echo 'The personal site deployment workflow is not active.' >&2
            exit 1
          fi
          echo 'GitHub App authentication and access to the active personal site workflow are verified.'
      - name: Trigger the personal site deployment with the tested revision
        if: ${{ !inputs.verify_only && steps.latest.outputs.current == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: gh workflow run deploy.yml --repo a2h1r0/personal-page --ref master --raw-field game_revision="$SOURCE_SHA"
